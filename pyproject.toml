[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem0-mcp-selfhosted"
version = "0.3.2"
description = "Self-hosted mem0 MCP server for Claude Code"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "elvismdev" },
]
dependencies = [
    # Upper bounds are deliberate: `uvx --from git+...` re-resolves on every
    # install, so an unbounded major bump upstream breaks new installs with no
    # change here. mcp 2.0.0 did exactly that. Raise a bound only after testing.
    "mcp[cli]>=2,<3",
    # mem0ai 2.x ships the v3 memory algorithm (single-pass extraction,
    # multi-signal retrieval). There is no longer a `graph` extra — graph
    # memory moved to the hosted Platform — so requesting it is a silent no-op
    # at best. `nlp` pulls spaCy, without which lemmatize_for_bm25() falls back
    # to returning raw text and BM25 scoring quietly degrades to nonsense.
    "mem0ai[llms,nlp]>=2.0.18,<3",
    # fastembed provides the BM25 sparse encoder. Without it mem0 disables
    # keyword search silently and hybrid retrieval collapses to semantic-only.
    "fastembed>=0.8,<1",
    # Qdrant refuses to guarantee behaviour when the client is more than one
    # minor ahead of the server, and mem0ai's floor alone lets the resolver
    # pick a client well past whatever Qdrant you actually run. Raise this in
    # step with your server, not ahead of it.
    "qdrant-client>=1.12,<1.19",
    "anthropic>=0.77.0,<1",
    "python-dotenv>=1.2.1,<2",
]

[project.scripts]
mem0-mcp-selfhosted = "mem0_mcp_selfhosted:main"
mem0-hook-context = "mem0_mcp_selfhosted.hooks:context_main"
mem0-hook-stop = "mem0_mcp_selfhosted.hooks:stop_main"
mem0-install-hooks = "mem0_mcp_selfhosted.hooks:install_main"

[tool.hatch.build.targets.wheel]
packages = ["src/mem0_mcp_selfhosted"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Only needed when MEM0_ENABLE_GRAPH=true, which requires a Neo4j you run
# yourself. graph_tools.py imports neo4j lazily, so the tools simply are not
# registered when this extra is absent.
graph = [
    "neo4j>=5.23.1,<7",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require live infrastructure (Qdrant, Ollama, Anthropic, Neo4j)",
    "contract: tests that validate mem0ai internal API stability",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/mem0_mcp_selfhosted/__init__.py:__version__"]
branches.main = { match = "main", prerelease = false }
tag_format = "v{version}"
commit_parser = "angular"
commit_message = "chore(release): v{version} [skip ci]"
upload_to_pypi = false
upload_to_repository = false

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf"]
minor_tags = ["feat"]
allowed_tags = [
    "build", "chore", "ci", "docs", "feat", "fix",
    "perf", "refactor", "style", "test",
]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge ",
]

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
